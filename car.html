<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاشف سرعة السيارات</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
  #app{padding:1rem;max-width:700px;margin:auto}
  h2{font-size:20px;font-weight:600;margin-bottom:.4rem}
  p.sub{font-size:13px;color:#666;margin-bottom:1rem}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
  .card{background:#fff;border-radius:10px;padding:.75rem 1rem;text-align:center;border:1px solid #e0e0e0}
  .card .label{font-size:12px;color:#888;margin-bottom:4px}
  .card .val{font-size:26px;font-weight:600;color:#222}
  .card .unit{font-size:11px;color:#aaa}
  #canvas-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;border:1px solid #ddd;background:#000;aspect-ratio:16/9}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  .overlay-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:14px;text-align:center;pointer-events:none;text-shadow:0 1px 3px #000a}
  .controls{display:flex;gap:8px;margin-top:.75rem;flex-wrap:wrap;align-items:center}
  button{font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#222;cursor:pointer}
  button:hover{background:#f0f0f0}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#178cf2;border-color:#178cf2;color:#fff}
  button.primary:hover{background:#1079d4}
  .calib{display:flex;align-items:center;gap:8px;font-size:13px;color:#666}
  .calib input{width:70px;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid #ccc}
  #log{margin-top:.75rem;max-height:120px;overflow-y:auto;font-size:12px;color:#555;border:1px solid #e0e0e0;border-radius:8px;padding:.5rem;background:#fafafa}
</style>
</head>
<body>
<div id="app">
  <h2>🚗 كاشف سرعة السيارات</h2>
  <p class="sub">يستخدم كاميرا الهاتف والذكاء الاصطناعي لتقدير سرعة المركبات</p>

  <div class="cards">
    <div class="card"><div class="label">آخر سرعة مرصودة</div><div class="val" id="v-last">--</div><div class="unit">كم/س</div></div>
    <div class="card"><div class="label">أعلى سرعة</div><div class="val" id="v-max">--</div><div class="unit">كم/س</div></div>
    <div class="card"><div class="label">عدد المركبات</div><div class="val" id="v-count">0</div><div class="unit">مركبة</div></div>
  </div>

  <div id="canvas-wrap">
    <video id="vid" autoplay muted playsinline></video>
    <canvas id="c"></canvas>
    <div class="overlay-msg" id="msg">اضغط "تشغيل الكاميرا" للبدء</div>
  </div>

  <div class="controls">
    <button class="primary" id="btn-start">▶ تشغيل الكاميرا</button>
    <button id="btn-stop" disabled>⏹ إيقاف</button>
    <div class="calib">
      <span>عرض الطريق:</span>
      <input type="number" id="road-width" value="6" min="2" max="30">
      <span>متر</span>
    </div>
  </div>

  <div id="log"><span style="color:#bbb">السجل سيظهر هنا...</span></div>
</div>

<!-- TensorFlow.js + COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
const vid    = document.getElementById('vid');
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const msg    = document.getElementById('msg');
const btnStart = document.getElementById('btn-start');
const btnStop  = document.getElementById('btn-stop');
const logEl  = document.getElementById('log');
const vLast  = document.getElementById('v-last');
const vMax   = document.getElementById('v-max');
const vCount = document.getElementById('v-count');

let stream = null, rafId = null, model = null;
let trackers = {}, nextId = 1, maxSpeed = 0, totalCount = 0;
let lastFrameTime = 0, modelLoaded = false;
let ROAD_WIDTH_M = 6;

/* ---------- helpers ---------- */
function log(t) {
  const d  = new Date();
  const ts = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  logEl.innerHTML = `<div>${ts} — ${t}</div>` + logEl.innerHTML;
}
function pad(n){ return String(n).padStart(2,'0'); }

function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[0]+a[2], b[0]+b[2]), y2 = Math.min(a[1]+a[3], b[1]+b[3]);
  const inter = Math.max(0, x2-x1) * Math.max(0, y2-y1);
  const union = a[2]*a[3] + b[2]*b[3] - inter;
  return union > 0 ? inter/union : 0;
}

function centerOf(box){ return { x: box[0]+box[2]/2, y: box[1]+box[3]/2 }; }

/* ---------- model ---------- */
async function loadModel() {
  msg.textContent = 'جاري تحميل نموذج الذكاء الاصطناعي...';
  try {
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    modelLoaded = true;
    log('✅ تم تحميل النموذج بنجاح');
    msg.textContent = '';
  } catch(e) {
    log('⚠️ فشل تحميل النموذج: ' + e.message);
    msg.textContent = 'فشل تحميل النموذج';
  }
}

/* ---------- camera ---------- */
async function startCamera() {
  ROAD_WIDTH_M = parseFloat(document.getElementById('road-width').value) || 6;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    vid.srcObject = stream;
    await new Promise(r => vid.onloadedmetadata = r);
    canvas.width  = vid.videoWidth  || 640;
    canvas.height = vid.videoHeight || 360;
    btnStart.disabled = true;
    btnStop.disabled  = false;
    msg.textContent   = '';
    log('📷 الكاميرا تعمل — ' + canvas.width + '×' + canvas.height);
    if (!modelLoaded) await loadModel();
    rafId = requestAnimationFrame(processFrame);
  } catch(e) {
    log('❌ خطأ: ' + e.message);
    msg.textContent = 'تعذّر الوصول إلى الكاميرا';
  }
}

function stopCamera() {
  if (rafId)  cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; rafId = null;
  btnStart.disabled = false; btnStop.disabled = true;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  msg.textContent = 'اضغط "تشغيل الكاميرا" للبدء';
  log('⏹ تم إيقاف الكاميرا');
}

/* ---------- detection & tracking ---------- */
const VEHICLE_CLASSES = ['car','truck','bus','motorcycle','bicycle'];

async function processFrame(ts) {
  if (!stream || !modelLoaded) { rafId = requestAnimationFrame(processFrame); return; }
  const dt = (ts - lastFrameTime) / 1000 || 0.033;
  lastFrameTime = ts;

  ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);

  let detections = [];
  try {
    const preds = await model.detect(canvas, 10, 0.4);
    detections  = preds.filter(p => VEHICLE_CLASSES.includes(p.class));
  } catch(e) {}

  const W = canvas.width, H = canvas.height;
  const pixelsPerMeter = W / ROAD_WIDTH_M;

  const used = new Set();
  const newTrackers = {};

  for (const det of detections) {
    const box = det.bbox;
    const c   = centerOf(box);
    let bestId = null, bestScore = -1;

    for (const [id, tr] of Object.entries(trackers)) {
      if (used.has(id)) continue;
      const overlap = iou(box, tr.box);
      const dist    = Math.hypot(c.x - tr.cx, c.y - tr.cy);
      const score   = overlap*0.7 + (1 - Math.min(dist,200)/200)*0.3;
      if (score > bestScore && (overlap > 0.15 || dist < 80)) { bestScore = score; bestId = id; }
    }

    if (bestId) {
      used.add(bestId);
      const tr  = trackers[bestId];
      const dx  = (c.x - tr.cx) / pixelsPerMeter;
      const dy  = (c.y - tr.cy) / pixelsPerMeter;
      const distM   = Math.hypot(dx, dy);
      const rawKmh  = dt > 0 ? (distM / dt) * 3.6 : 0;
      const alpha   = 0.25;
      const smoothKmh = tr.speed*(1-alpha) + rawKmh*alpha;
      const cappedKmh = Math.min(smoothKmh, 200);
      newTrackers[bestId] = { box, cx:c.x, cy:c.y, speed:cappedKmh, class:det.class, age:(tr.age||0)+1 };
    } else {
      const id = 'v'+(nextId++);
      newTrackers[id] = { box, cx:c.x, cy:c.y, speed:0, class:det.class, age:0 };
      totalCount++;
      vCount.textContent = totalCount;
    }
  }

  trackers = newTrackers;

  /* ---------- draw ---------- */
  for (const [id, tr] of Object.entries(trackers)) {
    if (tr.age < 2) continue;
    const [bx, by, bw, bh] = tr.box;
    const spd   = Math.round(tr.speed);
    const color = spd > 80 ? '#e24b4a' : spd > 50 ? '#f5a623' : '#178cf2';

    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = color;
    ctx.fillRect(bx, by-22, bw, 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`${tr.class} — ${spd} كم/س`, bx+4, by-6);

    if (spd > 0) {
      vLast.textContent = spd;
      if (spd > maxSpeed) {
        maxSpeed = spd;
        vMax.textContent = maxSpeed;
        if (spd > 100) log(`🚨 سرعة عالية! ${spd} كم/س (${tr.class})`);
      }
    }
  }

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, H-28, 210, 28);
  ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'left';
  ctx.fillText(`مركبات مرصودة: ${Object.keys(trackers).length}`, 8, H-10);

  rafId = requestAnimationFrame(processFrame);
}

/* ---------- init ---------- */
btnStart.addEventListener('click', startCamera);
btnStop.addEventListener('click', stopCamera);
window.addEventListener('load', () => {
  if (typeof cocoSsd !== 'undefined') loadModel();
  else msg.textContent = 'جاري تحميل المكتبات...';
});
</script>
</body>
</html>
